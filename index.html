<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKA</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#070a14;font-family:Poppins;display:flex;flex-direction:column;overflow-x:hidden}
header{width:100%;height:60px;background:#131a33;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #00f5ff22}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #00f5ff}
header span{color:#fff;font-weight:800;margin-left:10px;letter-spacing:3px}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:20px}
.c{position:relative;width:200px;height:170px;background:#131a33;display:flex;padding-left:12px;border-radius:28px;transition:all.8s cubic-bezier(.68,-0.55,.27,1.55);border:1px solid #1e2a5a}
.cards{display:flex;width:90%;height:90%;align-items:center}
.card{position:absolute;width:115px;height:115px;border-radius:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:800;font-size:11px;transition:all.8s cubic-bezier(.68,-0.55,.27,1.55)}
.card:nth-child(1){background:#00f5ff;z-index:4}
.card:nth-child(2){background:#00d0ff;z-index:3}
.card:nth-child(3){background:#0099cc;z-index:2}
.card:nth-child(4){background:#0a2342;z-index:1}
.b{position:absolute;right:-18px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;border:2px solid #00f5ff;box-shadow:0 0 10px #00f5ff;cursor:pointer;z-index:10;transition:.8s}
.b img{width:16px;transition:.8s}
@media (min-width:768px){
.c{width:500px;height:400px;border-radius:70px;padding-left:30px}
.card{width:220px;height:220px;border-radius:50px;font-size:22px}
.b{width:61px;height:61px;right:-30px}.b img{width:30px}
header{height:70px;padding:0 30px}header img{width:48px;height:48px}
}
</style></head><body>
<header><img src="arka.png"><span>ARKA</span></header>
<div class="main"><div class="c" id="m"><div class="cards">
<a href="about.html" class="card">ABOUT</a>
<a href="#" class="card">WORK</a>
<a href="#" class="card">CONTACT</a>
<a href="#" class="card">PLAY</a>
</div><div class="b" id="btn" onclick="e()"><img id="i" src="https://img.icons8.com/forma-regular-filled/100/000000/forward.png"></div></div></div>
<script>
var m=document.getElementById("m"),a=document.getElementsByClassName("card"),im=document.getElementById("i"),btn=document.getElementById("btn"),f=0;
// set awal
function init(){
 let d=innerWidth>=768;
 if(d){
  for(let j=0;j<a.length;j++){a[j].style.marginLeft=(j*50)+"px";a[j].style.marginTop="0px";}
  m.style.width="500px";m.style.height="400px";btn.style.right="-30px";btn.style.top="50%";btn.style.transform="translateY(-50%)";
 }else{
  for(let j=0;j<a.length;j++){a[j].style.marginLeft=(j*8)+"px";a[j].style.marginTop=(j*8)+"px";}
  m.style.width="200px";m.style.height="170px";btn.style.right="-18px";btn.style.top="50%";btn.style.transform="translateY(-50%)";im.style.rotate="90deg";
 }
}
init();
function e(){
 let d=innerWidth>=768;
 if(d){
  if(f==0){m.style.width="1050px";im.style.rotate="180deg";let ml=0;for(let j=0;j<a.length;j++){a[j].style.marginLeft=ml+"px";ml+=250}f=1}
  else{m.style.width="500px";im.style.rotate="0deg";let ml=0;for(let j=0;j<a.length;j++){a[j].style.marginLeft=ml+"px";ml+=50}f=0}
 }else{
  if(f==0){m.style.height="380px";im.style.rotate="270deg";btn.style.top="92%";let mt=0;for(let j=0;j<a.length;j++){a[j].style.marginTop=mt+"px";a[j].style.marginLeft="0px";mt+=65}f=1}
  else{m.style.height="170px";im.style.rotate="90deg";btn.style.top="50%";let mt=0;for(let j=0;j<a.length;j++){a[j].style.marginTop=mt+"px";a[j].style.marginLeft=(j*8)+"px";mt+=8}f=0}
 }
}
window.onresize=init;
</script></body></html>
