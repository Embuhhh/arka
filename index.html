<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#ffda8a;font-family:Poppins,sans-serif;display:flex;justify-content:center;padding:20px}
.box{position:relative;width:310px;background:#fff;border-radius:50px;padding:30px 30px 50px;box-shadow:0 10px 0 #0001}
.card{position:relative;width:200px;height:160px;background:#ff9f1c;border-radius:30px 30px 30px 30px;padding:15px;color:#fff;font-weight:800;margin-bottom:22px;transition:.6s cubic-bezier(.68,-0.55,.27,1.55)}
/* coakan kanan kayak di foto */
.card::after{content:'';position:absolute;right:-1px;top:55%;width:28px;height:40px;background:#fff;border-radius:20px 0 0 20px}
.card b{font-size:13px}
.icon{font-size:50px;margin-top:10px;display:block;text-align:center}
.btn{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:70px;height:45px;background:#fff;border-radius:0 0 30px 30px;display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 8px 0 #0001}
.btn::before{content:'';position:absolute;top:0;left:-20px;width:20px;height:20px;background:radial-gradient(circle at 0 100%, transparent 20px, #fff 21px)}
.btn::after{content:'';position:absolute;top:0;right:-20px;width:20px;height:20px;background:radial-gradient(circle at 100% 100%, transparent 20px, #fff 21px)}
</style></head><body>
<div class="box" id="box">
<div class="card" style="margin-top:0" id="c0"><b>Burger</b></div>
<div class="card" id="c1"><b>Chicken</b><span class="icon">🍗</span></div>
<div class="card" id="c2"><b>Pizza</b><span class="icon">🍕</span></div>
<div class="card" id="c3"><b>Lollipop</b><span class="icon">🍭</span></div>
<div class="btn" onclick="go()"><span id="ar" style="font-size:22px;transition:.6s">⌃</span></div>
</div>
<script>
let o=1; // 1 = buka kayak foto mu
function go(){
 let cs=[c0,c1,c2,c3];
 if(o==1){ // tutup jadi numpuk
  for(let i=0;i<4;i++){cs[i].style.marginTop="-130px"; cs[i].style.transform=`translateX(${i*6}px)`}
  ar.style.rotate="180deg"; o=0;
 }else{ // buka lagi kayak foto mu
  for(let i=0;i<4;i++){cs[i].style.marginTop="0px"; cs[i].style.transform="translateX(0px)"}
  ar.style.rotate="0deg"; o=1;
 }
}
</script>
</body></html>
