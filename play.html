<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKA POTION</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap');
body{margin:0;background:#070a14;color:#fff;font-family:Poppins}
header{height:60px;background:#131a33;display:flex;align-items:center;padding:0 15px}
header img{width:38px;height:38px;border-radius:50%;border:2px solid #00f5ff}
.wrap{max-width:400px;margin:15px auto;padding:15px;text-align:center}
.top{display:flex;justify-content:space-between;background:#131a33;border:1px solid #1e2a5a;padding:12px 18px;border-radius:18px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#131a33;padding:10px;border-radius:20px;min-height:380px}
.cell{aspect-ratio:1;border-radius:12px;display:flex;justify-content:center;align-items:center;font-weight:800;font-size:18px}
.btn{width:100%;margin-top:10px;padding:13px;border-radius:30px;border:0;font-weight:800;background:#00f5ff}
</style></head><body>
<header><img src="arka.png" onclick="location.href='index.html'"><span style="margin-left:10px;font-weight:800;letter-spacing:2px">ARKA / POTION</span></header>
<div class="wrap">
<div class="top"><span>SCORE:<b id="sc" style="color:#00f5ff">0</b></span><span>TAP+SLIDE!</span></div>
<div class="grid" id="grid"></div>
<button class="btn" onclick="location.reload()">RESET POTION</button>
<button class="btn" style="background:#0a2342;color:#fff;border:1px solid #00f5ff44" onclick="location.href='index.html'">← HOME</button>
</div>
<script>
const cols=['#ff3b6a','#ff9f1a','#ffe21a','#00f5ff','#a855f7','#ff00ff'];
let cells=[],sel=[],score=0,grid=document.getElementById('grid');
function rnd(){return Math.floor(Math.random()*3)}
function make(){grid.innerHTML='';cells=[];for(let i=0;i<36;i++){cells[i]=rnd();let d=document.createElement('div');d.className='cell';d.style.background=cols[cells[i]]+'33';d.style.border='2px solid '+cols[cells[i]];d.innerText=cells[i]+1;d.dataset.i=i;d.onpointerdown=e=>{sel=[+e.target.dataset.i];draw()};d.onpointerenter=e=>{if(sel.length&&+e.target.dataset.i!=sel[sel.length-1]&&Math.abs((+e.target.dataset.i%6)-(sel[sel.length-1]%6))<=1&&Math.abs(Math.floor(+e.target.dataset.i/6)-Math.floor(sel[sel.length-1]/6))<=1&&cells[+e.target.dataset.i]==cells[sel[0]]&&!sel.includes(+e.target.dataset.i)){sel.push(+e.target.dataset.i);draw()}};grid.appendChild(d)}}
function draw(){[...grid.children].forEach((el,i)=>{el.style.transform=sel.includes(i)?'scale(1.15)':'';el.style.boxShadow=sel.includes(i)?'0 0 12px '+cols[cells[i]]:''});}
grid.onpointerup=()=>{if(sel.length>=2){let last=sel[sel.length-1];let base=cells[sel[0]];sel.slice(0,-1).forEach(id=>cells[id]=-1);cells[last]=Math.min(base+1,5);score+= (base+1)*sel.length*10;sc.innerText=score;for(let c=0;c<6;c++){let col=[];for(let r=5;r>=0;r--){let id=r*6+c;if(cells[id]!=-1)col.push(cells[id])}for(let r=5;r>=0;r--){let id=r*6+c;cells[id]=col[5-r]!==undefined?col[5-r]:rnd()}}make()}sel=[];draw()};
make();
</script></body></html>
