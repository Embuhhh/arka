<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY - ARKA GAME</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#070a14;color:#fff;font-family:Poppins}
header{height:60px;background:#131a33;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #00f5ff22}
header img{width:40px;height:40px;border-radius:50%;border:2px solid #00f5ff}
.wrap{max-width:500px;margin:20px auto;padding:20px;text-align:center}
.scorebox{display:flex;justify-content:space-between;background:#131a33;border:1px solid #1e2a5a;padding:15px 20px;border-radius:20px;margin-bottom:15px}
.area{position:relative;width:100%;height:380px;background:#131a33;border:1px solid #1e2a5a;border-radius:30px;overflow:hidden}
.target{position:absolute;width:55px;height:55px;background:#00f5ff;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#001a1a;font-weight:800;cursor:pointer;box-shadow:0 0 20px #00f5ff;transition:.15s}
.btn{margin-top:15px;background:#00f5ff;color:#001a1a;padding:12px 25px;border-radius:30px;font-weight:800;cursor:pointer;border:0;width:100%;font-family:Poppins}
.btn2{background:#0a2342;color:#fff;border:1px solid #00f5ff44;margin-top:10px}
</style></head><body>
<header><img src="arka.png" onclick="location.href='index.html'" style="cursor:pointer"><span style="margin-left:10px;font-weight:800;letter-spacing:3px">ARKA / PLAY</span></header>
<div class="wrap">
<div class="scorebox"><span>SCORE: <b id="sc" style="color:#00f5ff">0</b></span><span>TIME: <b id="tm" style="color:#ff3b3b">15</b>s</span></div>
<div class="area" id="area"><div style="margin-top:150px;opacity:.4">Klik START dulu!</div></div>
<button class="btn" id="start" onclick="startGame()">START GAME</button>
<button class="btn btn2" onclick="location.href='index.html'">← HOME</button>
</div>
<script>
let score=0,time=15,timer=null,playing=false;let area=document.getElementById('area');
function startGame(){score=0;time=15;playing=true;sc.innerText=0;tm.innerText=15;start.innerText="RESTART";area.innerHTML='';spawn();clearInterval(timer);timer=setInterval(()=>{time--;tm.innerText=time;if(time<=0)endGame()},1000)}
function spawn(){if(!playing)return;area.innerHTML='';let t=document.createElement('div');t.className='target';t.innerText='ARKA';t.style.left=Math.random()*(area.clientWidth-70)+'px';t.style.top=Math.random()*(area.clientHeight-70)+'px';t.onclick=()=>{score++;sc.innerText=score;t.style.transform='scale(1.5)';setTimeout(spawn,100)};area.appendChild(t)}
function endGame(){playing=false;clearInterval(timer);area.innerHTML=`<div style="margin-top:120px"><div style="font-size:50px">🎉</div><h2 style="color:#00f5ff">SCORE ${score}</h2><p style="opacity:.6;font-size:13px">${score>10?'Gila cepet bet!':'Lumayan, coba lagi!'}</p></div>`}
</script></body></html>
