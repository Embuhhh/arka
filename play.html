<script>
// ... di atas render() tambahin ini:
let audioCtx;
function popSound(lvl){
 try{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  let o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value=200 + lvl*120;
  g.gain.setValueAtTime(0.4, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.25);
  o.start(); o.stop(audioCtx.currentTime+0.25);
  if(lvl>=3){ // suara double buat level tinggi
   setTimeout(()=>popSound(lvl-1),80)
  }
 }catch(e){}
}
</script>
