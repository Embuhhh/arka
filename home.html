<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKA - Home</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070a14;font-family:Poppins;display:flex;flex-direction:column}
header{width:100%;height:60px;background:#131a33;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #00f5ff22}
header img{width:40px;height:40px;border-radius:50%;border:2px solid #00f5ff}header span{color:#fff;font-weight:800;margin-left:10px;letter-spacing:3px}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:20px}
.box{position:relative;width:310px;background:#131a33;border:1px solid #1e2a5a;border-radius:50px;padding:30px 30px 60px;box-shadow:0 0 25px #00f5ff15}
.card{position:relative;width:200px;height:145px;border-radius:28px;padding:14px 18px;font-weight:800;font-size:14px;transition:.6s cubic-bezier(.68,-0.55,.27,1.55);margin-bottom:18px;cursor:pointer}
.card::after{content:'';position:absolute;right:-2px;top:54%;width:26px;height:38px;background:#131a33;border-radius:18px 0 0 18px}
.c0{background:#00f5ff;color:#001a1a}.c1{background:#00d0ff;color:#001a1a}.c2{background:#0099cc;color:#fff}.c3{background:#0a2342;color:#fff;border:1px solid #00f5ff44}
.btn{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:72px;height:44px;background:#131a33;border:2px solid #00f5ff;border-top:0;border-radius:0 0 28px 28px;display:flex;justify-content:center;align-items:center;cursor:pointer}
</style></head><body>
<header><img src="arka.png"><span>ARKA</span></header>
<div class="main"><div class="box">
<div class="card c0" id="c0" onclick="location.href='about.html'">ABOUT</div>
<div class="card c1" id="c1" onclick="location.href='work.html'">WORK</div>
<div class="card c2" id="c2" onclick="location.href='contact.html'">CONTACT</div>
<div class="card c3" id="c3" onclick="location.href='play.html'">PLAY</div>
<div class="btn" onclick="go()"><span id="ar" style="color:#00f5ff;font-size:22px;transition:.6s">⌃</span></div>
</div></div>
<script>let o=1;function go(){let cs=[c0,c1,c2,c3];if(o==1){for(let i=0;i<4;i++){cs[i].style.marginTop="-115px";cs[i].style.transform=`translateX(${i*5}px)`}ar.style.rotate="180deg";o=0}else{for(let i=0;i<4;i++){cs[i].style.marginTop="0px";cs[i].style.transform="translateX(0px)"}ar.style.rotate="0deg";o=1}}</script>
</body></html>
